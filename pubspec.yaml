name: quran_app
description: Aplikasi Quran dengan berbagai Qari dan backsound alam
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.1.21
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  convert: ^3.1.2
  http: ^1.2.2
  provider: ^6.1.2
  rxdart: ^0.28.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/audio/backsounds/
