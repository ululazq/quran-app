name: quran_app
description: Quranizer - Aplikasi Quran Audio Player Modern dengan Qari Internasional dan Backsound Alam
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.4
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.13
  convert: ^3.1.2
  http: ^1.2.2
  provider: ^6.1.2
  rxdart: ^0.28.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  equatable: ^2.0.5
  audioplayers: ^6.6.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/audio/backsounds/
    - assets/videos/
